<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citizen Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap">

  <!-- Leaflet & Turf -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Manrope', sans-serif;
      background-color: #ffffff;
      color: #0B437E;
    }

    :root {
      --bs-primary: #0B437E;
    }

    .navbar {
      background-color: #0B437E !important;
    }

    #map {
      height: calc(100vh - 116px);
      width: 100%;
    }

    #infoPanel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #0B437E;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
      font-size: 16px;
      z-index: 1000;
    }

    .btn-primary:hover {
      background-color: #083c63;
      border-color: #083c63;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CleanSoft</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('shared.citizen_options') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('shared.about') }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('shared.citizen_options') }}">Back</a>
          </li>
        </ul>
        <span class="navbar-brand ms-auto">
          Citizen Map
        </span>
      </div>
    </div>
  </nav>

  <div id="map"></div>

  <div id="infoPanel">
    <div id="truckInfo">Truck: --</div>
    <div id="distanceInfo">Distance: -- km</div>
    <div id="etaInfo">ETA: -- min</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── Data from Flask ─────────────────────────────────────────────────────────
    const citizenLat      = {{ citizen_lat }};
    const citizenLon      = {{ citizen_lon }};
    const assignedDriverNo = "{{ driver_vehicle_no }}";
    const driverStart     = {{ driver_start|tojson }};
    const driverRoute      = {{ driver_route|tojson }};

    // ─── Your new constants ───────────────────────────────────────────────────
    const averageSpeed     = 25;      // km/h
    const stopTimeMinutes  = 2;       // minutes per prior stop
    const tolerance        = 0.0003;  // for matching coords


    // ─── Initialize Map ──────────────────────────────────────────────────────────
    const map = L.map("map").setView([citizenLat, citizenLon], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    // ─── Home Marker ──────────────────────────────────────────────────────────────
    const homeIcon = L.icon({
      iconUrl: "https://cdn-icons-png.flaticon.com/512/25/25694.png",
      iconSize: [35, 35],
      iconAnchor: [17, 35]
    });
    L.marker([citizenLat, citizenLon], { icon: homeIcon })
     .addTo(map)
     .bindPopup("Your Home");

    // ─── Only if a route is assigned ─────────────────────────────────────────────
    if (assignedDriverNo !== "N/A") {
      // 1) Truck start marker
      const truckIcon = L.icon({
        iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
        iconSize: [35, 35],
        iconAnchor: [17, 35]
      });
      L.marker([driverStart[0], driverStart[1]], { icon: truckIcon })
       .addTo(map)
       .bindPopup("Driver Start");

      // 2) Call OSRM for a real-road route
      const osrmUrl =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${driverStart[1]},${driverStart[0]};${citizenLon},${citizenLat}` +
        `?overview=full&geometries=geojson`;

      fetch(osrmUrl)
        .then(r => r.json())
        .then(data => {
          const route = data.routes && data.routes[0];
          if (!route) throw new Error("No route found");

          // Draw the road-following polyline
          const coords = route.geometry.coordinates.map(pt => [pt[1], pt[0]]);
          L.polyline(coords, { color: "blue", weight: 4 })
           .addTo(map)
           .bindPopup(`Route to your home`);

          // distance in km
          const distKm = (route.distance / 1000).toFixed(2);

          // compute how many stops before this citizen
          let citizenIndex = -1;
          for (let i = 0; i < driverRoute.length; i++) {
            if (
              Math.abs(driverRoute[i][0] - citizenLat) < tolerance &&
              Math.abs(driverRoute[i][1] - citizenLon) < tolerance
            ) {
              citizenIndex = i;
              break;
            }
          }
          const stopsBefore = citizenIndex > 0 ? (citizenIndex - 1) : 0;
          const stopsDelay = stopsBefore * stopTimeMinutes;

          // travel time (min) + stops delay
          const drivingMinutes = (route.distance / 1000 / averageSpeed) * 60;
          const totalMinutes   = drivingMinutes + stopsDelay;

          // update panel
          document.getElementById("truckInfo").textContent   = `Truck: ${assignedDriverNo}`;
          document.getElementById("distanceInfo").textContent = `Distance: ${distKm} km`;
          document.getElementById("etaInfo").textContent      = `ETA: ${totalMinutes.toFixed(1)} min`;
        })
        .catch(err => {
          console.error("Routing error:", err);
          document.getElementById("truckInfo").textContent   = `No Route`;
          document.getElementById("distanceInfo").textContent = `Distance: -- km`;
          document.getElementById("etaInfo").textContent      = `ETA: -- min`;
        });
    } else {
      // ─── No route (no waste submitted) ────────────────────────────────────
      document.getElementById("truckInfo").textContent   = `No Pickup Route`;
      document.getElementById("distanceInfo").textContent = `Distance: -- km`;
      document.getElementById("etaInfo").textContent      = `ETA: -- min`;
    }
  </script>
</body>
</html>
